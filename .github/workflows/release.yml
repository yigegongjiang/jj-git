name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "$GITHUB_REF_NAME"
